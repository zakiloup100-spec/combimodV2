name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Tests de la logique (sans Minecraft)
        run: sh tests/run.sh

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14

      - name: Build du mod
        run: gradle build --no-daemon

      - name: Publier le .jar
        uses: actions/upload-artifact@v4
        with:
          name: combimod-jar
          path: build/libs/*.jar
